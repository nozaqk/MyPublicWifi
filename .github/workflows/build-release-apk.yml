name: Build release APK

on:
  push:
    branches:
      - arena/05148e4a-mypublicwifi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platforms and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create build-time signing keystore
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storetype JKS \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MyPublicWiFi, OU=Mobile, O=MyPublicWiFi, L=Accra, ST=Greater Accra, C=GH"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        id: build
        run: |
          set -o pipefail
          mkdir -p release
          gradle --no-daemon :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish the single latest APK to the branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p release
          tail -n 400 "$RUNNER_TEMP/build.log" > release/BUILD_LOG.txt 2>/dev/null || echo "no log" > release/BUILD_LOG.txt
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*-release.apk" | head -n 1)
          if [ "${{ steps.build.outcome }}" = "success" ] && [ -n "$APK" ]; then
            cp "$APK" release/MyPublicWiFi-latest-release.apk
            echo "APK published: $APK"
          else
            echo "Build failed; keeping the previous APK in release/ if present."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "build: latest release APK (run ${GITHUB_RUN_NUMBER}) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
