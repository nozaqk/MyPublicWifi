name: Build release APK

on:
  push:
    branches:
      - arena/05148e4a-mypublicwifi
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform 36.1
        run: yes | sdkmanager --licenses > /dev/null || true; sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signing keystore (build-time)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${KEYSTORE_PASSWORD:-$(openssl rand -hex 16)}"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload.jks" -storetype JKS \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=MyPublicWiFi, OU=Mobile, O=MyPublicWiFi, L=Accra, ST=Greater Accra, C=GH"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and rename APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          APK=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unsigned*" | head -n 1)
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/out/MyPublicWiFi-release.apk"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: MyPublicWiFi-release-apk
          path: ${{ runner.temp }}/out/MyPublicWiFi-release.apk
          if-no-files-found: error
          retention-days: 7
